      --cream: #FAF6F0;

      margin: 0;
      padding: 0;
    }

    html {

    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.35;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 2rem 3.5rem;
      background: var(--plum);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 28%, rgba(116, 82, 154, 0.55) 0%, rgba(90, 63, 122, 0.2) 40%, rgba(42, 26, 64, 0.2) 100%),
        linear-gradient(180deg, #5b3e7e 0%, #43295f 42%, #2d1d47 100%);
      z-index: -2;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 33px,
        rgba(255,255,255,0.055) 33px,
        rgba(255,255,255,0.055) 34px
      );
      pointer-events: none;
      z-index: -1;
    }

    .hero-inner {
      position: relative;
      text-align: center;
      width: 100%;
      max-width: 1100px;
    }

    .hero-logo-wrap {
      width: 152px;
      height: 152px;
      margin: 0 auto 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 14px 44px rgba(0,0,0,0.22);
      backdrop-filter: blur(3px);
    }

    .hero-logo {
      width: 92px;
      height: 92px;
      display: block;
    }
